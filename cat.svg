<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="A cartoon cat blinking and swishing its tail beside a small network of connected nodes">
  <style>
    .tail { transform-box: fill-box; transform-origin: 8% 90%; animation: swish 2.2s ease-in-out infinite; }
    @keyframes swish { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(16deg); } }
    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.025, 1.04); } }
    .head { transform-box: fill-box; transform-origin: 50% 100%; animation: tilt 5s ease-in-out infinite; }
    @keyframes tilt { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-4deg); } 65% { transform: rotate(4deg); } }
    .ear-l { transform-box: fill-box; transform-origin: 50% 100%; animation: twitch 4.5s ease-in-out infinite; }
    .ear-r { transform-box: fill-box; transform-origin: 50% 100%; animation: twitch 4.5s ease-in-out -2.2s infinite; }
    @keyframes twitch { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-14deg); } 94% { transform: rotate(6deg); } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    .look { animation: look 6s ease-in-out infinite; }
    @keyframes look { 0%, 15% { transform: translate(0, 0); } 30%, 50% { transform: translate(-4px, 1px); } 65%, 85% { transform: translate(4px, 0); } 100% { transform: translate(0, 0); } }
    .nd { transform-box: fill-box; transform-origin: center; animation: pop 2.6s ease-in-out infinite; }
    .nd:nth-of-type(2n) { animation-delay: -.9s; } .nd:nth-of-type(3n) { animation-delay: -1.7s; }
    @keyframes pop { 50% { transform: scale(1.2); } }
    .say { animation: say 7s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
    @keyframes say { 0%, 55%, 100% { opacity: 0; transform: scale(.4); } 62%, 90% { opacity: 1; transform: scale(1); } 96% { opacity: 0; transform: scale(.9); } }
    .zig { stroke-dasharray: 3 9; animation: dash 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
  </style>

  <rect x="3" y="3" width="474" height="254" rx="26" fill="#FFF8E6" stroke="#1B2540" stroke-width="5"/>
  <circle cx="420" cy="58" r="30" fill="#FFE9A8"/>

  <!-- small network -->
  <g stroke="#1B2540" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7">
    <path class="zig" d="M52 120L100 82M100 82L150 128M150 128L110 168M52 120L110 168M100 82L110 168"/>
    <path class="zig" d="M350 150L398 112M398 112L440 160M350 150L398 196M398 112L398 196M440 160L398 196"/>
  </g>
  <g fill="#fff" stroke="#1B2540" stroke-width="3.5">
    <circle class="nd" cx="52" cy="120" r="9" fill="#5BB8FF"/><circle class="nd" cx="100" cy="82" r="11"/><circle class="nd" cx="150" cy="128" r="9" fill="#6EDBB4"/><circle class="nd" cx="110" cy="168" r="10"/>
    <circle class="nd" cx="350" cy="150" r="9" fill="#FFC83D"/><circle class="nd" cx="398" cy="112" r="11"/><circle class="nd" cx="440" cy="160" r="9" fill="#5BB8FF"/><circle class="nd" cx="398" cy="196" r="10" fill="#6EDBB4"/>
  </g>
  <g fill="#FFC83D" stroke="#1B2540" stroke-width="2.5">
    <circle r="5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M52 120L100 82L150 128"/></circle>
    <circle r="5"><animateMotion dur="3.2s" begin="-1.2s" repeatCount="indefinite" path="M110 168L52 120L100 82"/></circle>
    <circle r="5"><animateMotion dur="2.8s" repeatCount="indefinite" path="M350 150L398 112L440 160"/></circle>
    <circle r="5"><animateMotion dur="3.4s" begin="-1.5s" repeatCount="indefinite" path="M398 196L398 112L350 150"/></circle>
  </g>

  <!-- ground -->
  <path d="M5 222C100 200 210 210 280 222C360 236 430 212 475 206V232Q475 257 450 257H30Q5 257 5 232Z" fill="#9BE7C9" stroke="#1B2540" stroke-width="4" stroke-linejoin="round"/>

  <!-- cat -->
  <g class="tail"><path d="M290 214C340 214 352 168 328 140" fill="none" stroke="#1B2540" stroke-width="22" stroke-linecap="round"/><path d="M290 214C340 214 352 168 328 140" fill="none" stroke="#FFC83D" stroke-width="13" stroke-linecap="round"/></g>
  <g class="breathe">
    <ellipse cx="240" cy="204" rx="54" ry="40" fill="#FFC83D" stroke="#1B2540" stroke-width="5"/>
    <ellipse cx="240" cy="214" rx="30" ry="26" fill="#FFE9A8"/>
    <path d="M218 238v-10M240 241v-12M262 238v-10" stroke="#1B2540" stroke-width="3.500" stroke-linecap="round"/>
  </g>
  <g class="head">
    <g class="ear-l"><path d="M204 100L198 58L232 84z" fill="#FFC83D" stroke="#1B2540" stroke-width="5" stroke-linejoin="round"/><path d="M208 88L206 70L222 82z" fill="#FFB3C7"/></g>
    <g class="ear-r"><path d="M276 100L282 58L248 84z" fill="#FFC83D" stroke="#1B2540" stroke-width="5" stroke-linejoin="round"/><path d="M272 88L274 70L258 82z" fill="#FFB3C7"/></g>
    <ellipse cx="240" cy="124" rx="50" ry="44" fill="#FFC83D" stroke="#1B2540" stroke-width="5"/>
    <path d="M232 82q8 12 16 0M240 80v10" fill="none" stroke="#1B2540" stroke-width="3.500" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="206" cy="140" rx="9" ry="7" fill="#FF9EB5"/><ellipse cx="274" cy="140" rx="9" ry="7" fill="#FF9EB5"/>
    <g class="eye"><ellipse cx="220" cy="120" rx="11" ry="14" fill="#fff" stroke="#1B2540" stroke-width="3.500"/><g class="look"><circle cx="220" cy="122" r="6" fill="#1B2540"/></g></g>
    <g class="eye"><ellipse cx="260" cy="120" rx="11" ry="14" fill="#fff" stroke="#1B2540" stroke-width="3.500"/><g class="look"><circle cx="260" cy="122" r="6" fill="#1B2540"/></g></g>
    <path d="M233 138h14l-7 8z" fill="#FF7A5C" stroke="#1B2540" stroke-width="3" stroke-linejoin="round"/>
    <path d="M240 146q-7 10-15 4M240 146q7 10 15 4" fill="none" stroke="#1B2540" stroke-width="3.500" stroke-linecap="round"/>
    <path d="M200 138l-26-5M200 146l-26 5M280 138l26-5M280 146l26 5" stroke="#1B2540" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- speech bubble -->
  <g class="say">
    <rect x="296" y="52" width="86" height="40" rx="18" fill="#fff" stroke="#1B2540" stroke-width="4"/>
    <path d="M304 90l-10 16 24-10z" fill="#fff" stroke="#1B2540" stroke-width="4" stroke-linejoin="round"/>
    <path d="M300 88h14" stroke="#fff" stroke-width="6"/>
    <text x="339" y="79" text-anchor="middle" font-family="Fredoka, Nunito, Arial, sans-serif" font-weight="700" font-size="22" fill="#1B2540">meow</text>
  </g>
</svg>
